[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iiae"
version = "1.0.0"
description = "Intelligent Invariant Audit Engine SDK"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # minimal SDK dependencies
]

[project.optional-dependencies]
core = [
    "sentence-transformers",
    "transformers",
    "torch",
    "networkx"
]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
include = ["iiae", "iiae_demo"]
