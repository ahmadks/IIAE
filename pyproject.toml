[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "IIAE"
version = "1.0.0"
description = "Intelligent Invariant Audit Engine Workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["SLT*"]

[tool.pyright]
include = ["."]
extraPaths = [
    "./Idicoc_notary",
    "./SLT"
]