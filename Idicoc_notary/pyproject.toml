[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idicoc-notary"
version = "2.0.0"
description = "IDICOC Notary SDK: Audit framework for AI systems with deterministic consensus and merkle custody."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "IIAE Contributors", email = "support@iiae.io"}
]
keywords = ["audit", "ai", "notary", "merkle", "deterministic", "consensus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.8.0",
    "pandas>=1.3.0",
    "python-dotenv>=0.19.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.25.0",
    "torch>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/idicoc-notary-core"
Documentation = "https://idicoc-notary-core.readthedocs.io"
Repository = "https://github.com/yourusername/idicoc-notary-core.git"
"Bug Tracker" = "https://github.com/yourusername/idicoc-notary-core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["idicoc_notary*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false

[tool.pyrefly]
# Raíz del proyecto: permite resolver correctamente idicoc_notary y tests
project_root = "."
search_path = [".", "tests"]

# Dependencias opcionales: boto3, psycopg2 y pyqldb solo se usan en producción
# y se importan dinámicamente. Se suprimen sus errores de "source not found".
ignore_missing_source = [
    "boto3",
    "botocore",
    "psycopg2",
    "psycopg2.extras",
    "pyqldb",
    "pyqldb.driver",
    "pyqldb.driver.qldb_driver",
    "dotenv",
]

# Excluir carpetas que no son parte del paquete distribuible
exclude = [
    ".venv/**",
    "**/__pycache__/**",
    "build/**",
    "dist/**",
]